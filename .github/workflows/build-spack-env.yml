name: Build Spack environment

on:
  workflow_call:
    inputs:
      environment:
        description: Name of a directory under environments/
        required: true
        type: string
      runner:
        required: false
        type: string
        default: ubuntu-24.04
      base-image:
        description: Base image used when pushing runnable images to the build cache
        required: false
        type: string
        default: ubuntu:24.04
      tests:
        description: Run build-time tests of the root specs and Spack stand-alone tests
        required: false
        type: boolean
        default: false
      container:
        description: >-
          Image to run the job in (e.g. nvidia/cuda:...-devel). Its CUDA toolkit or
          ROCm, if any, is registered as non-buildable externals. Empty runs on the
          runner.
        required: false
        type: string
        default: ''
      image-spec:
        description: >-
          Root spec of the environment to publish as a runnable image in the build
          cache registry.
        required: false
        type: string
        default: ''
      image-tag:
        description: Image tag, pushed as <image-tag> and <image-tag>-<UTC date>
        required: false
        type: string
        default: ''
    outputs:
      image:
        description: Dated image reference, if an image was pushed
        value: ${{ jobs.build.outputs.image }}

env:
  SPACK_ENV_DIR: environments/${{ inputs.environment }}
  # OCI repository names must be lowercase.
  BUILDCACHE_URL: oci://ghcr.io/scorec/scorec-spack-buildcache
  PUSH_BUILDCACHE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: ${{ inputs.environment }}
    runs-on: ${{ inputs.runner }}
    outputs:
      image: ${{ steps.tag-image.outputs.image }}
    # An empty image runs the job directly on the runner.
    container:
      image: ${{ inputs.container }}
    steps:
    # Container images (unlike the runner) lack Spack's prerequisites. Install
    # them before checkout so actions/checkout can use git.
    - name: Install Spack prerequisites
      if: ${{ inputs.container != '' }}
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          build-essential gfortran git python3 ca-certificates curl file patch \
          unzip bzip2 xz-utils zstd

    - uses: actions/checkout@v5

    # Equivalent of spack/setup-spack, which the repo's Actions policy
    # (GitHub-owned actions only) doesn't allow.
    - name: Checkout Spack
      uses: actions/checkout@v5
      with:
        repository: spack/spack
        ref: releases/v1.2
        path: .spack/spack

    - name: Checkout Spack packages
      uses: actions/checkout@v5
      with:
        repository: spack/spack-packages
        ref: releases/v2026.10
        path: .spack/spack-packages

    - name: Set up Spack
      run: |
        echo "$GITHUB_WORKSPACE/.spack/spack/bin" >> "$GITHUB_PATH"
        echo "SPACK_COLOR=always" >> "$GITHUB_ENV"
        echo "SPACK_DISABLE_LOCAL_CONFIG=1" >> "$GITHUB_ENV"
        export PATH="$GITHUB_WORKSPACE/.spack/spack/bin:$PATH"
        export SPACK_DISABLE_LOCAL_CONFIG=1
        spack repo set --destination "$GITHUB_WORKSPACE/.spack/spack-packages" builtin
        spack mirror add --unsigned github-actions-buildcache oci://ghcr.io/spack/github-actions-buildcache

    - name: Add SCOREC build cache
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        spack mirror add --unsigned \
          --oci-username-variable GITHUB_ACTOR \
          --oci-password-variable GITHUB_TOKEN \
          scorec-buildcache "$BUILDCACHE_URL"

    - name: Register container CUDA toolkit
      if: ${{ inputs.container != '' }}
      run: |
        if [ -x /usr/local/cuda/bin/nvcc ]; then
          export PATH="/usr/local/cuda/bin:$PATH"
          spack -e "$SPACK_ENV_DIR" external find --not-buildable cuda
        fi

    # The ROCm image has only HIP. PETSc+rocm also needs the math libraries,
    # which come from the image's AMD apt repository. Spack does not detect
    # llvm-amdgpu there, so every ROCm package is registered explicitly.
    - name: Register container ROCm
      if: ${{ inputs.container != '' }}
      run: |
        if [ -d /opt/rocm ]; then
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            hipblas-dev hipsparse-dev hipsolver-dev rocblas-dev rocsparse-dev \
            rocsolver-dev rocrand-dev rocprim-dev rocthrust-dev
          rocm="$(realpath /opt/rocm)"
          version="$(cut -d- -f1 < "$rocm/.info/version")"
          {
            echo "packages:"
            for pkg in hip hsa-rocr-dev comgr rocm-core rocminfo llvm-amdgpu \
                       rocblas rocsparse rocsolver rocrand rocprim rocthrust \
                       hipblas hipblas-common hipsparse hipsolver; do
              prefix="$rocm"
              [ "$pkg" = llvm-amdgpu ] && prefix="$rocm/llvm"
              printf '  %s:\n    buildable: false\n    externals:\n    - spec: %s@%s\n      prefix: %s\n' \
                "$pkg" "$pkg" "$version" "$prefix"
            done
          } > rocm-externals.yaml
          spack -e "$SPACK_ENV_DIR" config add --file rocm-externals.yaml
        fi

    - name: Concretize
      run: |
        spack -e "$SPACK_ENV_DIR" concretize --fresh \
          ${{ inputs.tests && '--test root' || '' }}
        spack -e "$SPACK_ENV_DIR" find -c -l

    - name: Upload spack.lock
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.environment }}-spack.lock
        path: ${{ env.SPACK_ENV_DIR }}/spack.lock

    - name: Install
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # MPI tests may launch more ranks than the runner has cores.
        OMPI_MCA_rmaps_base_oversubscribe: "1"
        PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
      run: |
        # Root specs track git branches, so their hashes don't change when the
        # branch moves; always rebuild them from source and only pull
        # dependencies from the cache.
        spack -e "$SPACK_ENV_DIR" install --fail-fast -j "$(nproc)" \
          --use-buildcache package:never,dependencies:auto \
          ${{ inputs.tests && '--test=root' || '' }}

    - name: Stand-alone tests
      if: ${{ inputs.tests }}
      env:
        OMPI_MCA_rmaps_base_oversubscribe: "1"
        PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
      # Only test the root specs, not their dependencies.
      run: spack -e "$SPACK_ENV_DIR" test run --explicit

    - name: Push to build cache
      if: ${{ !cancelled() && env.PUSH_BUILDCACHE == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Push whatever got installed, even if the install step failed, so
        # the next run doesn't rebuild it. --allow-missing skips specs that
        # aren't installed, like build deps of packages pulled from the cache.
        spack -e "$SPACK_ENV_DIR" buildcache push --unsigned --update-index --allow-missing \
          --base-image "${{ inputs.base-image }}" \
          scorec-buildcache

    # Only tag images whose build and tests passed.
    - name: Push container image
      id: tag-image
      if: ${{ inputs.image-spec != '' && env.PUSH_BUILDCACHE == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IMAGE_SPEC: ${{ inputs.image-spec }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        push() {
          spack -e "$SPACK_ENV_DIR" buildcache push --unsigned --allow-missing \
            --base-image "${{ inputs.base-image }}" "$@" scorec-buildcache "$IMAGE_SPEC"
        }
        # The root tracks a git branch, so its hash is stable and the push above
        # skipped it if it was already cached. Overwrite it with this build.
        push --force --only package
        # Not forced: --tag only includes layers for specs in the same push, and
        # this one finds them all in the cache without uploading anything.
        dated="$IMAGE_TAG-$(date -u +%Y-%m-%d)"
        push --tag "$dated"
        push --tag "$IMAGE_TAG"
        echo "image=${BUILDCACHE_URL#oci://}:$dated" >> "$GITHUB_OUTPUT"

    - name: Collect build logs
      if: failure()
      run: |
        mkdir -p build-logs
        stage="$(spack location -S)"
        # configure.log is written by PETSc into its source dir (spack-src/).
        # install-time-test-log.txt holds the --test=root (ctest) output.
        find "$stage" -maxdepth 3 \( -name 'spack-build-out.txt' -o -name 'spack-build-env.txt' -o -name 'configure.log' \
          -o -name 'install-time-test-log.txt' \) \
          -exec sh -c 'pkg=${1#"$2"/}; pkg=${pkg%%/*}; cp "$1" "build-logs/${pkg}-$(basename "$1")"' _ {} "$stage" \;
        # Stand-alone test (spack test run) output.
        if [ -d ~/.spack/test ]; then
          find ~/.spack/test -name '*-test-out.txt' -exec cp {} build-logs/ \;
        fi

    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.environment }}-build-logs
        path: build-logs/
        if-no-files-found: ignore
