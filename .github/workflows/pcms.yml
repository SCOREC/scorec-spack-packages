name: PCMS environment

on:
  push:
    branches: [main]
    paths: &paths
    - environments/pcms/**
    - environments/pcms-cuda/**
    - environments/pcms-rocm/**
    - spack_repo/scorec/repo.yaml
    - spack_repo/scorec/packages/pcms/**
    - spack_repo/scorec/packages/redev/**
    - spack_repo/scorec/packages/meshfields/**
    - spack_repo/scorec/packages/omega_h/**
    - .github/workflows/pcms.yml
    - .github/workflows/build-spack-env.yml
  pull_request:
    paths: *paths
  schedule:
  # Weekly rebuild to pick up new commits on tracked branches and keep the
  # build cache warm for downstream CI.
  - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-spack-env.yml
    with:
      environment: pcms
      tests: true
      # Published as a runnable CPU image on main.
      image-spec: pcms+python+petsc
      image-tag: pcms-develop

  # Compile-only: hosted runners have no GPU, so no tests. The container
  # provides nvcc; compiling for cuda_arch=75 needs no device.
  build-cuda:
    uses: ./.github/workflows/build-spack-env.yml
    with:
      environment: pcms-cuda
      container: nvidia/cuda:12.6.3-devel-ubuntu24.04
      base-image: nvidia/cuda:12.6.3-devel-ubuntu24.04

  # Compile-only for Frontier's MI250X (gfx90a) with Frontier's ROCm version.
  build-rocm:
    uses: ./.github/workflows/build-spack-env.yml
    with:
      environment: pcms-rocm
      container: rocm/dev-ubuntu-24.04:6.4.2
      base-image: rocm/dev-ubuntu-24.04:6.4.2

  # Checks the published image runs on a plain base image, outside the
  # environment it was built in.
  test-container:
    needs: build
    if: ${{ needs.build.outputs.image != '' }}
    runs-on: ubuntu-24.04
    steps:
    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Run image
      env:
        IMAGE: ${{ needs.build.outputs.image }}
      run: |
        docker pull "$IMAGE"
        docker run --rm "$IMAGE" python3 -c "import pcms"
        docker run --rm \
          -e OMPI_ALLOW_RUN_AS_ROOT=1 -e OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1 \
          -e OMPI_MCA_rmaps_base_oversubscribe=1 \
          "$IMAGE" mpirun -n 2 python3 -c "import pcms"
