name: PUMI-Tally environment

on:
  push:
    branches: [main]
    paths: &paths
    - environments/pumi-tally/**
    - environments/pumi-tally-cuda/**
    - environments/pumi-tally-neutrals/**
    - spack_repo/scorec/repo.yaml
    - spack_repo/scorec/packages/pumi_tally/**
    - spack_repo/scorec/packages/pumi_pic/**
    - spack_repo/scorec/packages/engpar/**
    - spack_repo/scorec/packages/omega_h/**
    - .github/workflows/pumi-tally.yml
    - .github/workflows/build-spack-env.yml
  pull_request:
    paths: *paths
  schedule:
  # Weekly rebuild to pick up new commits on tracked branches and keep the
  # build cache warm for downstream CI.
  - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-spack-env.yml
    with:
      environment: pumi-tally
      tests: true

  build-neutrals:
    uses: ./.github/workflows/build-spack-env.yml
    with:
      environment: pumi-tally-neutrals
      tests: true

  # Compile-only: hosted runners have no GPU. The container provides nvcc;
  # compiling for cuda_arch=75 needs no device.
  build-cuda:
    uses: ./.github/workflows/build-spack-env.yml
    with:
      environment: pumi-tally-cuda
      container: nvidia/cuda:12.6.3-devel-ubuntu24.04
      base-image: nvidia/cuda:12.6.3-devel-ubuntu24.04
