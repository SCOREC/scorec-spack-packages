spack:
  specs:
  - matrix:
    - [pcms@develop]
    - ['~python', '+python']
    # netcdf and exodus ride along with +petsc so the +python+petsc spec has
    # every feature published in the container image without extra builds.
    - ['~petsc', '+petsc +netcdf ^omega-h+exodus']
    - ['^kokkos+serial+openmp']

  repos:
    scorec: $env/../../spack_repo/scorec

  packages:
    all:
      # armv8.2a should run on both the runners (Neoverse N2) and Apple silicon
      require:
      - one_of: [target=x86_64_v3, target=armv8.2a]
    petsc:
      # Drop this once the petsc conflicts("~openmp", when="+kokkos ^kokkos+openmp").
      # Currently when Kokkos/kokkos-kernels+openmp, petsc recipe may pick ~openmp
      # see https://github.com/spack/spack-packages/pull/7137
      require: '+openmp'

  concretizer:
    # Required so mutually exclusive variants can coexist in one environment.
    unify: false
    reuse: false

  config:
    install_tree:
      # Padding lets binaries from the build cache relocate to any install root.
      padded_length: 128

  view: false
