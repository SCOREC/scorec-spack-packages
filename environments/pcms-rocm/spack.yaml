# PCMS environment (ROCm), for Frontier's MI250X (gfx90a) and ROCm 6.4.2.
#
# Built (compile-only, no GPU) by .github/workflows/pcms.yml in
# rocm/dev-ubuntu-24.04:6.4.2 with the ROCm math libraries PETSc needs. ROCm
# comes from externals: CI registers the container's ROCm, local builds use the
# site/user packages.yaml.
spack:
  specs:
  - matrix:
    - [pcms@develop]
    - ['~python', '+python']
    - ['~petsc', '+petsc']
    # ~tests: pcms runs its test executables at build time (catch_discover_tests),
    # which initializes Kokkos and fails on CI runners without a GPU.
    - ['+rocm amdgpu_target=gfx90a ~tests']

  repos:
    scorec: $env/../../spack_repo/scorec

  packages:
    all:
      # GitHub runners vary in architecture
      require: target=x86_64_v3

  concretizer:
    # Required so mutually exclusive variants can coexist in one environment.
    unify: false
    reuse: false

  config:
    install_tree:
      # Padding lets binaries from the build cache relocate to any install root.
      padded_length: 128

  view: false
